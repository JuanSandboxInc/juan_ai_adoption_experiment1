<!-- Sandbox Labs · How generative AI works (one slideshow: Phase 1 + Phase 2 + prediction rounds) · Webflow Code Embed (self-contained) -->
<style>
.hw-root{--hw-navy:#13181d;--hw-grey:#d1d1d1;--hw-green:#1bc594;--hw-purple:#c596fe;--hw-line:rgba(19,24,29,.16);--hw-dim:rgba(19,24,29,.62);
  container:hw / inline-size;color:var(--hw-navy);font-family:inherit;font-weight:400}
.hw-root *,.hw-root *::before,.hw-root *::after{box-sizing:border-box}
.hw-root :where(h3,p,ol,li,figure){margin:0;padding:0}
.hw-root :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hw-root :focus-visible{outline:3px solid var(--hw-navy);outline-offset:3px}
.hw{display:flex;flex-direction:column;gap:clamp(28px,3.4cqw,48px)}
.hw:focus-visible{outline-offset:8px}

/* ---- step rail, grouped by phase ---- */
.hw-rail{display:flex;align-items:flex-end;gap:clamp(10px,1.6cqw,24px)}
.hw-ph{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
.hw-ph__h{align-self:flex-start;display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;line-height:1.5;font-weight:400;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--hw-green)}
.hw-ph__h b{font-weight:500}
.hw-ph--2 .hw-ph__h{background:var(--hw-purple)}
.hw-segs{list-style:none;display:flex;gap:6px}
.hw-segs li{flex:1 1 0;min-width:0;list-style:none;transition:flex-grow .4s ease}
.hw-seg{width:100%;display:flex;flex-direction:column;gap:10px;padding:8px 0 6px;text-align:left;font-size:16px;line-height:1.3;color:rgba(19,24,29,.45);transition:color .3s}
.hw-seg__bar{position:relative;display:block;height:3px;border-radius:2px;background:var(--hw-line);overflow:hidden}
.hw-seg__fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--hw-navy);transition:width .5s ease}
.hw-seg__txt{display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-seg__txt b{font-weight:400;font-variant-numeric:tabular-nums}
.hw-seg__txt span{overflow:hidden;text-overflow:ellipsis}
.hw-seg.is-done{color:var(--hw-dim)}
.hw-seg.is-done .hw-seg__fill{width:100%;background:rgba(19,24,29,.45)}
.hw-seg[aria-current="step"]{color:var(--hw-navy)}
.hw-ph--1 .hw-seg[aria-current="step"] .hw-seg__fill{background:var(--hw-navy)}
@media (hover:hover){.hw-seg:hover{color:var(--hw-navy)}}
.hw-hand{flex:none;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;gap:10px;color:rgba(19,24,29,.45);transition:color .3s}
.hw-hand svg{margin-top:-5px;width:34px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hw-hand__dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;transition:background-color .3s}
.hw-hand.is-done{color:var(--hw-dim)}
.hw-hand[aria-current="step"]{color:var(--hw-navy)}
.hw-hand[aria-current="step"] .hw-hand__dot,.hw-hand.is-done .hw-hand__dot{background:currentColor}

/* ---- main: text + visual ---- */
.hw-main{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:clamp(24px,4cqw,64px);align-items:stretch}
.hw-text,.hw-vis__stage,.hw-pm{display:grid}
.hw-t,.hw-v,.hw-pm__s{grid-area:1/1;min-width:0;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s linear .45s}
.hw-t.is-on,.hw-v.is-on,.hw-pm__s.is-on{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease .08s,transform .6s cubic-bezier(.2,.7,.2,1) .08s,visibility 0s}
.hw-t{align-self:start;padding-top:4px}
.hw-t__eyebrow{display:none;margin-bottom:12px;font-size:13px;line-height:1.5;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--hw-dim)}
.hw-t__num{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;background:var(--hw-green);font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums}
.hw-t--p2 .hw-t__num{background:var(--hw-purple)}
.hw-t--hand .hw-t__num{background:none;box-shadow:inset 0 0 0 1px var(--hw-navy);padding:3px 12px}.hw-t__num svg{width:28px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hw-t__title{margin-top:20px;font-size:44px;line-height:1.2;font-weight:400;letter-spacing:-1px;text-wrap:balance}
.hw-t__body{margin-top:20px;font-size:22px;line-height:1.45;max-width:34em;color:rgba(19,24,29,.82);text-wrap:pretty}

.hw-vis{min-width:0;display:flex;flex-direction:column;border:1px solid rgba(19,24,29,.3);
  background-image:linear-gradient(rgba(19,24,29,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(19,24,29,.06) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px;container:hwv / inline-size}
.hw-vis__stage{flex:1 1 auto;min-height:clamp(330px,34cqw,500px);padding:clamp(18px,3cqw,40px)}
.hw-v{align-self:center;justify-self:stretch}
.hw-v svg{display:block;width:100%;height:auto;max-height:440px;overflow:visible}
.hw-svg text{font-family:inherit;font-size:15px;fill:var(--hw-navy)}

/* 01 training data */
.hw-src rect{fill:rgba(255,255,255,.35);stroke:var(--hw-navy);stroke-width:1.2}
.hw-ico{fill:none;stroke:var(--hw-navy);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hw-flow{fill:var(--hw-green);opacity:0}
.hw-v.is-on .hw-flow{animation:hw-flow 2.4s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i) * .3s)}
@keyframes hw-flow{0%{opacity:0;transform:translateX(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(130px)}}
.hw-dot{fill:var(--hw-navy);opacity:.14}
.hw-v.is-on .hw-dot{animation:hw-on .5s ease both;animation-delay:calc(.5s + var(--i) * 55ms)}
@keyframes hw-on{to{opacity:1}}
.hw-v.is-on .hw-dot.hw-dot--g{animation:hw-on .5s ease both,hw-g .6s ease both;animation-delay:calc(.5s + var(--i) * 55ms),calc(2.8s + var(--i) * 30ms)}
@keyframes hw-g{to{fill:var(--hw-green)}}

/* 02 learning */
.hw-e{fill:none;stroke:var(--hw-navy);stroke-width:1.1;stroke-dasharray:1;stroke-dashoffset:1;opacity:.75}
.hw-v.is-on .hw-e{animation:hw-draw .9s ease both;animation-delay:calc(.2s + var(--i) * 70ms)}
@keyframes hw-draw{to{stroke-dashoffset:0}}
.hw-e--k{stroke:var(--hw-green);opacity:1;stroke-linecap:round}
.hw-v.is-on .hw-e--k{animation:hw-draw .9s ease both,hw-thick .9s ease both;animation-delay:calc(.2s + var(--i) * 70ms),calc(2.3s + var(--j) * .25s)}
@keyframes hw-thick{to{stroke-width:6}}
.hw-n{fill:var(--hw-navy)}
.hw-n--k{fill:#fff;stroke:var(--hw-navy);stroke-width:2.5}
.hw-lab{opacity:0}
.hw-lab rect{fill:var(--hw-grey);stroke:var(--hw-navy);stroke-width:1}
.hw-v.is-on .hw-lab{animation:hw-on .5s ease both;animation-delay:calc(2.3s + var(--j) * .25s)}

/* 03 the model */
.hw-box{fill:rgba(255,255,255,.28);stroke:var(--hw-navy);stroke-width:1.2;stroke-dasharray:5 6}
.hw-sp{fill:none;stroke:var(--hw-navy);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.hw-v.is-on .hw-sp{animation:hw-draw 1s ease both;animation-delay:calc(.3s + var(--i) * 90ms)}
.hw-web{fill:none;stroke:var(--hw-navy);stroke-width:.8;opacity:0}
.hw-v.is-on .hw-web{animation:hw-on 1.2s ease 1.2s both}
.hw-v.is-on .hw-web{animation-name:hw-web}
@keyframes hw-web{to{opacity:.35}}
.hw-core{fill:#fff;stroke:var(--hw-navy);stroke-width:3}
.hw-pulse{fill:var(--hw-navy);opacity:0;transform-box:fill-box;transform-origin:center}
.hw-v.is-on .hw-pulse{animation:hw-pulse 2.8s ease-out 1.4s infinite}
@keyframes hw-pulse{0%{opacity:.22;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.hw-pct{opacity:0}
.hw-pct text:last-child{fill:var(--hw-dim)}
.hw-svg .hw-pct__w{font-size:19px}
.hw-v.is-on .hw-pct{animation:hw-on .6s ease both;animation-delay:calc(1.6s + var(--i) * .3s)}
.hw-ghost{opacity:0}
.hw-v.is-on .hw-ghost{animation:hw-ghost 1.6s ease both}
@keyframes hw-ghost{0%,35%{opacity:.75}100%{opacity:0}}

/* handoff */
.hw-track{fill:none;stroke:var(--hw-navy);stroke-width:1.2}
.hw-mv{transform-box:view-box}
.hw-v.is-on .hw-mv{animation:hw-mv 2s cubic-bezier(.6,0,.3,1) .4s both}
@keyframes hw-mv{from{transform:translateX(0)}to{transform:translateX(330px)}}
.hw-blk{fill:#fff;stroke:var(--hw-navy);stroke-width:1.4}
.hw-pill1{fill:var(--hw-green)}.hw-pill2{fill:var(--hw-purple)}

/* 04 prompt (HTML) */
.hw-pr{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3cqw,28px);width:100%}
.hw-pr__box{width:100%;max-width:640px;display:flex;align-items:center;gap:14px;padding:clamp(14px,2.4cqw,22px) clamp(16px,3cqw,26px);border:1px solid var(--hw-navy);border-radius:14px;background:rgba(255,255,255,.55);font-size:clamp(22px,4.4cqw,38px);line-height:1.2;letter-spacing:-.02em}
.hw-pr__txt{flex:1 1 auto;min-width:0}
.hw-pr__w{opacity:0}
.hw-v.is-on .hw-pr__w{animation:hw-on .25s ease both;animation-delay:calc(.35s + var(--i) * .32s)}
.hw-car{display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.12em;background:var(--hw-navy)}
.hw-v.is-on .hw-car{animation:hw-blink 1.1s steps(1) infinite}
@keyframes hw-blink{50%{opacity:0}}
.hw-pr__send{flex:none;width:clamp(34px,5cqw,44px);height:clamp(34px,5cqw,44px);border-radius:50%;background:var(--hw-navy);display:grid;place-items:center}
.hw-pr__send svg{width:50%;height:50%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hw-pr__arr{width:14px;height:clamp(26px,5cqw,44px);opacity:0}
.hw-pr__arr svg{width:100%;height:100%;fill:none;stroke:var(--hw-navy);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hw-v.is-on .hw-pr__arr{animation:hw-on .4s ease 2.2s both}
.hw-toks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.hw-tok{padding:6px 14px;border-radius:999px;background:var(--hw-purple);font-size:clamp(16px,2.4cqw,22px);line-height:1.2;opacity:0;transform:translateY(8px)}
.hw-v.is-on .hw-tok{animation:hw-up .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(2.5s + var(--i) * .14s)}
@keyframes hw-up{to{opacity:1;transform:none}}
.hw-cap{font-size:13px;line-height:1.5;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--hw-dim)}
.hw-pr .hw-cap{opacity:0}
.hw-v.is-on .hw-pr .hw-cap{animation:hw-on .4s ease 3.3s both}

/* 05 prediction rounds (HTML) */
.hw-pmh{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:clamp(14px,2cqw,20px) clamp(18px,3cqw,40px) 0}
.hw-pmh__st{font-variant-numeric:tabular-nums}
.hw-v--pm{align-self:stretch;display:flex;flex-direction:column}
.hw-pm{flex:1 1 auto;align-items:center}
.hw-pm__s{align-self:center}
.hw-sent{font-size:clamp(28px,6cqw,60px);line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
.hw-sent--sm{font-size:clamp(17px,2.6cqw,24px);letter-spacing:-.01em;color:var(--hw-dim);margin-bottom:clamp(14px,2.4cqw,26px)}
.hw-blank{display:inline-block;width:1.9em;height:.08em;margin-left:.14em;vertical-align:baseline;background:currentColor;opacity:.5}
.hw-pm__s.is-on .hw-sent:not(.hw-sent--sm) .hw-blank{animation:hw-blank 1.6s ease-in-out infinite}
@keyframes hw-blank{50%{opacity:.12}}
.hw-new,.hw-old{display:inline-block}
.hw-new{padding:0 .14em;border-radius:.14em;background:var(--hw-purple)}
.hw-pm__s.is-on .hw-new{animation:hw-up .6s cubic-bezier(.2,.7,.2,1) .25s both}
.hw-old{background-image:linear-gradient(var(--hw-purple),var(--hw-purple));background-size:100% .1em;background-repeat:no-repeat;background-position:0 98%}
.hw-note{margin-top:clamp(12px,2cqw,20px);display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.4;color:var(--hw-dim)}
.hw-note b{font-weight:500;color:var(--hw-navy);font-variant-numeric:tabular-nums}
.hw-note svg{width:18px;height:18px;fill:none;stroke:var(--hw-navy);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hw-probs{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr) auto;gap:clamp(8px,1.4cqw,12px) clamp(12px,2.4cqw,24px);align-items:center}
.hw-prob{display:contents}
.hw-prob__n{font-size:clamp(16px,2.6cqw,22px);line-height:1.2;white-space:nowrap}
.hw-prob__t{position:relative;height:clamp(8px,1.2cqw,12px);border-radius:2px;background:rgba(19,24,29,.08);overflow:hidden}
.hw-prob__f{position:absolute;inset:0 auto 0 0;width:0;border-radius:2px;background:var(--hw-navy);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.hw-prob:first-child .hw-prob__f{background:#8f5bd6}
.hw-prob__p{min-width:3ch;text-align:right;font-size:clamp(14px,2cqw,17px);font-variant-numeric:tabular-nums;color:var(--hw-dim)}
.hw-prob--o .hw-prob__n{color:var(--hw-dim)}
.hw-prob--o .hw-prob__f{background:rgba(19,24,29,.3)}
.hw-pmc{min-height:calc(2 * 1.4em);padding:0 clamp(18px,3cqw,40px) clamp(14px,2cqw,20px);font-size:16px;line-height:1.4;color:rgba(19,24,29,.82)}

/* 06 response (HTML) */
.hw-rs{display:flex;flex-direction:column;gap:clamp(22px,4cqw,40px)}
.hw-rs__sent{font-size:clamp(28px,6cqw,60px);line-height:1.12;letter-spacing:-.03em}
.hw-rs__sent .hw-dimw{color:var(--hw-dim)}
.hw-rs__sent .hw-new{display:inline;padding:0;border-radius:0;opacity:0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hw-v.is-on .hw-rs__sent .hw-new{animation:hw-on .5s ease both;animation-delay:calc(.3s + var(--i) * .45s)}
.hw-outs{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.6cqw,16px)}
.hw-out{list-style:none;display:flex;flex-direction:column;gap:10px;padding:clamp(12px,2cqw,18px);border:1px solid var(--hw-navy);background:rgba(255,255,255,.4);font-size:16px;line-height:1.3;opacity:0;transform:translateY(8px)}
.hw-v.is-on .hw-out{animation:hw-up .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(2.2s + var(--i) * .18s)}
.hw-out svg{width:34px;height:26px;fill:none;stroke:var(--hw-navy);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---- foot: status + controls ---- */
.hw-foot{display:flex;align-items:center;justify-content:space-between;gap:14px 32px;flex-wrap:wrap;padding-top:clamp(18px,2cqw,24px);border-top:1px solid var(--hw-line)}
.hw-status{font-size:16px;line-height:1.4;color:var(--hw-dim);font-variant-numeric:tabular-nums}
.hw-btns{display:flex;align-items:center;gap:8px}
.hw-btn{height:44px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:16px;line-height:1;white-space:nowrap;transition:background-color .2s,color .2s,box-shadow .2s}
.hw-btn svg{width:13px;height:13px;fill:currentColor;flex:none}
.hw-play{box-shadow:inset 0 0 0 1px var(--hw-navy)}
.hw-play .hw-ic-pause,.hw-play[data-playing="true"] .hw-ic-play{display:none}
.hw-play[data-playing="true"] .hw-ic-pause{display:inline}
.hw-next{background:var(--hw-navy);color:#fff}
.hw-next svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hw-rst{color:var(--hw-dim)}
@media (hover:hover){.hw-play:hover{background:var(--hw-navy);color:#fff}.hw-next:hover{background:#2a333c}.hw-rst:hover{color:var(--hw-navy);background:rgba(19,24,29,.06)}}

/* ---- type scale (copied from 00-base2 / TYPE_SCALE: x-h2 + x-lead) ---- */
@media (max-width:991px){.hw-t__title{font-size:24px;line-height:1.15;letter-spacing:-.01em;margin-top:16px}.hw-t__body{font-size:19px;line-height:1.4;margin-top:14px}}
@media (max-width:479px){.hw-t__title{font-size:28px;letter-spacing:-.02em}.hw-status,.hw-pmc{font-size:15px}}

/* ---- layout by container width ---- */
@container hw (max-width:899px){
  .hw-main{grid-template-columns:minmax(0,1fr);gap:24px}
  .hw-t{padding-top:0}
  .hw-seg{font-size:14px}
}
@container hw (max-width:699px){
  .hw{gap:24px}
  .hw-rail{gap:8px}
  .hw-ph{gap:10px}
  .hw-ph__h{padding:4px 10px}
  .hw-ph__h span{display:none}
  .hw-seg{font-size:14px;gap:8px}
  .hw-seg__txt span{display:none}
  .hw-segs li:has(> [aria-current="step"]){flex-grow:6}
  .hw-seg[aria-current="step"] .hw-seg__txt span{display:inline}
  .hw-hand svg{width:22px}
  .hw-t__eyebrow{display:block}
  .hw-vis__stage{min-height:300px;padding:16px}
  .hw-outs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hw-foot{gap:12px}
  .hw-status{flex-basis:100%}
  .hw-btns{width:100%;justify-content:space-between;gap:4px}
  .hw-btn{padding:0 12px}
  .hw-play{padding:0 16px 0 14px}
}
@container hwv (max-width:560px){.hw-svg text{font-size:22px}.hw-svg .hw-pct__w{font-size:26px}}
@container hwv (max-width:420px){.hw-v--pm .hw-sent:not(.hw-sent--sm){font-size:30px}.hw-pmh .hw-pmh__lab{display:none}}
@media (prefers-reduced-motion:reduce){
  .hw-root *,.hw-root *::before,.hw-root *::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .hw-flow,.hw-pulse,.hw-ghost{display:none}
}
</style>

<div class="hw-root" data-hw>
  <div class="hw" role="region" aria-roledescription="slideshow" aria-label="How generative AI works, step by step">
    <div class="hw-rail" data-rail></div>
    <div class="hw-main">
      <div class="hw-text" aria-live="polite" data-text></div>
      <div class="hw-vis"><div class="hw-vis__stage" data-vis></div></div>
    </div>
    <div class="hw-foot">
      <p class="hw-status" data-status></p>
      <div class="hw-btns">
        <button type="button" class="hw-btn hw-play" data-play data-playing="false" aria-label="Play"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="hw-ic-play" d="M5 3.5v9l7-4.5z"/><path class="hw-ic-pause" d="M4.5 3.5h2.5v9H4.5zM9 3.5h2.5v9H9z"/></svg><span data-play-label>Play</span></button>
        <button type="button" class="hw-btn hw-next" data-next aria-label="Next step"><span data-next-label>Next step</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5"/></svg></button>
        <button type="button" class="hw-btn hw-rst" data-restart aria-label="Restart from the beginning">Restart</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ======================= EDIT CONTENT HERE =======================
     PHASES: rail group labels. STEPS: one slide each, in order (phase 0 = the hand-off between phases).
     vis: which picture to show ("data", "learn", "model", "handoff", "prompt", "predict", "response").
     alt: what the picture shows, for screen readers.
     START / ROUNDS: the prediction rounds shown in the "predict" step; the FIRST candidate is chosen.
     STAGES / CAPS: labels and captions for the four stages of each round.                          */
  var PHASES = [
    { strong: "Phase 1:", rest: "Building the model" },
    { strong: "Phase 2:", rest: "Using the model" }
  ];
  var STEPS = [
    { phase: 1, num: "01", title: "Training data", vis: "data",

        var shown = e.isIntersecting && e.intersectionRect.height >= Math.min(e.boundingClientRect.height * .6, innerHeight * .5);
        if (shown){ if (!timer) setPlaying(true, true); }
        else if (autoMode) setPlaying(false);
      }, { threshold: [0, .2, .4, .6, .8, 1] }).observe(el);
    }
    document.addEventListener("visibilitychange", function(){ if (document.hidden && autoMode) setPlaying(false); });
    render();
  }
  window.hwInit = hwInit;
  document.querySelectorAll(".hw-root[data-hw]").forEach(hwInit);
})();
</script>
