<!-- Sandbox Labs · Knowledge check (Spot the AI quiz) · Webflow Embed (self-contained: style + markup + script) -->
<style>
.kc-root{--kc-navy:#13181d;--kc-ink:#1e1d1b;--kc-grey:#d1d1d1;--kc-white:#fff;--kc-yellow:#f7ff88;--kc-focus:#1bc594;
  display:flex;justify-content:center;font-family:inherit}
.kc-root *,.kc-root *::before,.kc-root *::after{box-sizing:border-box}
.kc-root :where(h2,p,ul,li){margin:0;padding:0}
.kc-root :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
.kc-root :focus-visible{outline:3px solid var(--kc-focus);outline-offset:3px}
.kc-root sup{font-size:.645em;line-height:0;vertical-align:super}
.kc-root sup a{color:inherit;text-decoration:none}
.kc-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* entry card: the big yellow pill */
.kc-open{display:inline-flex;align-items:center;gap:.45em;padding:.36em .95em .4em;border:1px solid var(--kc-yellow);border-radius:999px;background:var(--kc-yellow);color:var(--kc-ink);font-size:clamp(28px,3.4vw + 6px,60px);line-height:1.1;letter-spacing:-.02em;transition:background-color .25s,border-color .25s}
.kc-open svg{width:.9em;height:.9em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.kc-open:hover{background:var(--kc-white);border-color:var(--kc-white)}
.kc-open:hover svg{transform:translateX(.18em)}
@media (max-width:899px){.kc-open{font-size:clamp(24px,6vw,32px);padding:.34em .85em .38em}}

/* the sheet (native modal dialog) */
dialog.kc-sheet{margin:clamp(24px,10vh,110px) auto auto;padding:0;border:0;width:min(860px,calc(100% - 32px));max-width:none;height:fit-content;max-height:calc(100% - clamp(24px,10vh,110px) - 24px);background:var(--kc-grey);color:var(--kc-navy);overflow-y:auto;overscroll-behavior:contain;font-family:inherit}
dialog.kc-sheet::backdrop{background:rgba(19,24,29,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog.kc-sheet[open]{animation:kc-in .5s cubic-bezier(.16,1,.3,1)}
dialog.kc-sheet[open]::backdrop{animation:kc-dim .4s ease}
dialog.kc-sheet.is-closing{animation:kc-out .26s cubic-bezier(.4,0,.6,1) forwards}
dialog.kc-sheet.is-closing::backdrop{animation:kc-dim .26s ease reverse forwards}
@keyframes kc-in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kc-out{to{opacity:0;transform:translateY(12px) scale(.985)}}
@keyframes kc-dim{from{opacity:0}to{opacity:1}}
html:has(dialog.kc-sheet[open]){overflow:hidden}
.kc-sheet :focus-visible{outline:3px solid var(--kc-navy);outline-offset:3px}
.kc-in{display:flex;flex-direction:column;gap:32px;padding:clamp(28px,4vw,48px)}
.kc-close{position:sticky;top:clamp(28px,4vw,48px);z-index:2;align-self:flex-end;width:44px;height:44px;display:grid;place-items:center;margin:0 0 -76px 0;border:1px solid var(--kc-navy)!important;border-radius:999px;background:var(--kc-grey)!important;color:var(--kc-navy);transition:background-color .2s,color .2s}
.kc-close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.kc-close:hover{background:var(--kc-navy)!important;color:var(--kc-grey)}
.kc-title{padding-right:64px;min-height:44px;display:flex;align-items:center;font-size:clamp(28px,2vw + 12px,40px);font-weight:400;line-height:1.1;letter-spacing:-.02em;color:var(--kc-navy)}

.kc-quiz{display:flex;flex-direction:column;gap:28px}
.kc-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid rgba(19,24,29,.18)}
.kc-count{font-size:13px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:rgba(19,24,29,.62);font-variant-numeric:tabular-nums}
.kc-dots{display:flex;gap:6px}
.kc-dots i{width:28px;height:4px;border-radius:2px;background:rgba(19,24,29,.14);transition:background-color .3s}
.kc-dots i.on{background:var(--kc-navy)}
.kc-scene{display:flex;align-items:center;gap:24px}
.kc-glyph{width:76px;height:76px;flex:none;display:grid;place-items:center;border:1px solid rgba(19,24,29,.35);border-radius:16px;color:var(--kc-navy)}
.kc-glyph svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.kc-glyph .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:kc-draw 1.1s cubic-bezier(.65,0,.35,1) .1s forwards}
@keyframes kc-draw{to{stroke-dashoffset:0}}
.kc-glyph--year{font-size:20px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kc-q{font-size:clamp(20px,.8vw + 12px,24px);font-weight:400;line-height:1.3;letter-spacing:-.2px;text-wrap:balance;animation:kc-up .35s ease both}
.kc-q:focus{outline:0}
.kc-hint{margin-top:8px;font-size:15px;line-height:1.4;color:rgba(19,24,29,.62)}
@keyframes kc-up{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.kc-answers{display:flex;flex-wrap:wrap;gap:10px}
.kc-ans{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:10px 20px;border:1px solid var(--kc-navy)!important;border-radius:999px;font-size:17px;line-height:1.3;white-space:nowrap;color:var(--kc-navy);transition:background-color .2s,border-color .2s,color .2s,opacity .2s}
.kc-ans:hover:not([disabled]){background:var(--c);border-color:var(--c)!important;color:var(--kc-ink)}
.kc-ans[disabled]{cursor:default}
.kc-ans svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:none}
.kc-ans.is-right{background:var(--c);border-color:var(--c)!important;color:var(--kc-ink);animation:kc-pop .45s cubic-bezier(.3,1.5,.5,1)}
.kc-ans.is-right svg{display:block}
.kc-ans.is-picked:not(.is-right){text-decoration:line-through;text-decoration-thickness:1px}
.kc-answers.done .kc-ans:not(.is-right):not(.is-picked){opacity:.35}
@keyframes kc-pop{from{transform:scale(.92)}to{transform:none}}
.kc-fbwrap{display:flex;flex-direction:column;gap:28px;min-height:var(--kc-fb-h,0px)}
.kc-wait{font-size:15px;color:rgba(19,24,29,.45)}
.kc-fb{display:flex;flex-direction:column;gap:10px;padding:22px 24px;border:1px solid rgba(19,24,29,.25);animation:kc-up .3s ease both}
.kc-res{display:flex;align-items:center;gap:10px;font-size:20px;line-height:1.3}
.kc-res svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kc-res.is-off svg{opacity:.5}
.kc-body{max-width:62ch;font-size:17px;line-height:1.5;color:rgba(19,24,29,.8)}
.kc-nav{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:auto}
.kc-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 22px;border:1px solid var(--kc-navy)!important;border-radius:999px;font-size:17px;line-height:1.2;color:var(--kc-navy);text-decoration:none;transition:background-color .2s,color .2s}
.kc-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kc-btn:hover{background:var(--kc-navy);color:var(--kc-white)}
.kc-btn--solid{background:var(--kc-navy);color:var(--kc-white)}
.kc-btn--solid:hover{background:var(--kc-ink)}
.kc-score{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:clamp(23px,1.6vw + 12px,34px);line-height:1.2;letter-spacing:-.4px}
.kc-score b{font-size:clamp(64px,6vw,96px);font-weight:500;line-height:1;letter-spacing:-.04em}

/* phones: a full-screen sheet */
@media (max-width:599px){
  dialog.kc-sheet{margin:0;width:100%;max-width:100%;height:100%;max-height:100%;min-height:100dvh}
  .kc-in{min-height:100%;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));gap:24px}
  .kc-close{top:16px;width:40px;height:40px;margin:0 0 -64px 0}
  .kc-title{padding-right:52px;min-height:40px}
  .kc-quiz{flex:1 1 auto;gap:24px}
  .kc-top{flex-direction:column;align-items:flex-start;gap:12px}
  .kc-dots{width:100%}
  .kc-dots i{flex:1;width:auto}
  .kc-scene{align-items:flex-start;gap:16px}
  .kc-glyph{width:52px;height:52px;border-radius:12px}
  .kc-glyph svg{width:32px;height:32px}
  .kc-glyph--year{font-size:15px}
  .kc-ans{font-size:16px;padding:8px 16px;min-height:42px}
  .kc-fb{padding:18px}
  .kc-body{font-size:16px}
  .kc-fbwrap{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){
  .kc-root *,.kc-root *::before,.kc-root *::after,dialog.kc-sheet,dialog.kc-sheet::backdrop{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>

<div class="kc-root" data-kc>
  <button type="button" class="kc-open" data-kc-open aria-haspopup="dialog">Test your knowledge<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5"/></svg></button>
  <dialog class="kc-sheet" aria-labelledby="kc-title">
    <div class="kc-in">
      <button type="button" class="kc-close" data-kc-close aria-label="Close quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <h2 class="kc-title" id="kc-title">Test your knowledge</h2>
      <div class="kc-quiz" data-kc-quiz></div>
    </div>
  </dialog>
</div>

<script>
(function(){
  /* ================= EDIT CONTENT HERE =================
     TYPES: the four answers (label + colour), in the order they are shown.
     Q: one entry per question, in order.
       g = picture (key of GLYPH) or y = a year shown instead of a picture · q = the question
       a = the right answer (key of TYPES) · why = the explanation · refs = reference numbers → #ref-N
     PARENT: "close" answers (picking machine learning for an LLM question says "close, but more specific").
     END: the link on the result screen.                                                          */
  var TYPES = {
    sym:{ name:"Symbolic AI", c:"#f7ff88", label:"symbolic AI" },
    ml:{ name:"Machine learning", c:"#c596fe", label:"machine learning" },
    gen:{ name:"Generative AI", c:"#af8780", label:"generative AI" },
    llm:{ name:"LLMs", c:"#ff885d", label:"an LLM" }
  };
  var ORDER = ["sym", "ml", "gen", "llm"];
  var PARENT = { llm:"gen", gen:"ml" };
  var Q = [
    { g:"face", q:"Your phone unlocks when it recognizes your face.", a:"ml", why:"Face unlock learned what faces look like from huge numbers of example images. It recognizes things, but it doesn’t create anything new." },
    { y:"1966", q:"ELIZA chats like a therapist by matching keywords to replies its creator scripted.", a:"sym", why:"Every reply came from rules Joseph Weizenbaum wrote. ELIZA couldn’t learn anything new; it followed the script.", refs:[24] },
    { g:"letter", q:"You ask ChatGPT to make your cover letter sound friendlier.", a:"llm", why:"ChatGPT runs on a large language model. It rewrites your letter by predicting one word at a time." },
    { y:"1959", q:"Arthur Samuel’s checkers program gets better by playing game after game against itself.", a:"ml", why:"It improved from experience instead of new rules, which is why Samuel called the idea machine learning.", refs:[23] },
    { g:"form", q:"Online tax software works out which forms you need by asking you a series of yes-or-no questions.", a:"sym", why:"It follows a decision tree of tax rules written by experts. Like the expert systems of the 1970s, it doesn’t learn from your answers." },
    { g:"image", q:"An app turns the sentence “a cat in a raincoat” into a brand-new picture.", a:"gen", why:"Image generators create new pictures from patterns learned from millions of captioned images. They’re generative AI, but not language models." },
    { y:"2014", q:"Two neural networks compete, one making fake images and one spotting them, until the fakes look real.", a:"gen", why:"These generative adversarial networks (GANs) were one of the first ways to create convincing new images.", refs:[27] },
    { g:"mail", q:"Your email app sums up a long thread in three bullet points.", a:"llm", why:"Summarizing is a language task. Those summaries are written by a large language model." },
    { y:"2022", q:"A chatbot reaches an estimated 100 million users in about two months.", a:"llm", why:"That chatbot was ChatGPT. It runs on a large language model, which writes by predicting the next word.", refs:[30] },
    { g:"video", q:"A video shows a politician saying something they never said.", a:"gen", why:"This is a deepfake: synthetic video made by generative AI trained on real footage of that person. It’s part of why information pollution is a growing risk." }
  ];
  var END = { href:"#how-it-works", label:"Next: how generative AI works" };
  var GLYPH = {
    face:'<rect x="11" y="3" width="18" height="34" rx="3.5"/><path d="M15 14v-3h3M25 14v-3h-3M15 22v3h3M25 22v3h-3"/><path d="M18 20.5c1.2 1 2.8 1 4 0"/><path d="M18.5 16.5v.5M21.5 16.5v.5"/>',
    form:'<path d="M10 4h15l6 6v26H10z"/><path d="M25 4v6h6"/><rect x="14" y="15" width="4" height="4"/><path d="M21 17h6"/><rect x="14" y="24" width="4" height="4"/><path d="M21 26h6"/><path d="M14.8 17.2l1.2 1.2 2.2-2.6"/>',
    letter:'<path d="M7 5h18v30H7z"/><path d="M11 11h10M11 16h10M11 21h6"/><path d="M34 13 23.5 23.5 22 28l4.5-1.5L37 16z"/>',
    image:'<rect x="5" y="7" width="30" height="26" rx="2"/><circle cx="14" cy="15" r="3"/><path d="M5 28l9-8 6 5 5-4 10 8"/>',
    video:'<rect x="4" y="6" width="32" height="24" rx="2"/><circle cx="20" cy="15" r="4.5"/><path d="M12 30c1-5 4.5-7.5 8-7.5s7 2.5 8 7.5"/><path d="M14 35h12"/>',
    mail:'<path d="M4 5h22v14H4z"/><path d="M4 5l11 8 11-8"/><path d="M19 25h.1M23 25h12M19 30h.1M23 30h12M19 35h.1M23 35h9"/>'
  };
  /* ====================================================== */

  var IC = { check:'<path d="M5 12.5 9.5 17 19 7.5"/>', dash:'<path d="M7 12h10"/>', arrow:'<path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5"/>' };
  function ic(n){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + "</svg>"; }
  function refs(list){ return (list && list.length) ? "<sup>" + list.map(function(n){ return '<a href="#ref-' + n + '">' + n + "</a>"; }).join(",") + "</sup>" : ""; }
  function isAncestor(p, c){ for (var x = PARENT[c]; x; x = PARENT[x]) if (x === p) return true; return false; }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function kcInit(root){
    if (!root || root.hasAttribute("data-kc-ready")) return;
    root.setAttribute("data-kc-ready", "");
    var sheet = root.querySelector("dialog"), quiz = root.querySelector("[data-kc-quiz]"), opener = root.querySelector("[data-kc-open]");
    var idx = 0, res = [];
    function $(s){ return quiz.querySelector(s); }
    function dots(){ return '<div class="kc-dots" aria-hidden="true">' + Q.map(function(_, i){ return '<i class="' + (i <= idx ? "on" : "") + '"></i>'; }).join("") + "</div>"; }
    function glyph(item){
      if (item.y) return '<span class="kc-glyph kc-glyph--year" aria-hidden="true">' + item.y + "</span>";
      return ('<span class="kc-glyph" aria-hidden="true"><svg viewBox="0 0 40 40">' + (GLYPH[item.g] || "") + "</svg></span>").replace(/<(path|rect|circle)\b/g, '<$1 class="draw" pathLength="120"');
    }
    function renderQ(focus){
      var item = Q[idx];
      quiz.innerHTML = '<div class="kc-top"><p class="kc-count">Question ' + (idx + 1) + " of " + Q.length + "</p>" + dots() + "</div>" +
        '<div class="kc-scene">' + glyph(item) + '<div><p class="kc-q" tabindex="-1">' + (item.y ? '<span class="kc-sr">' + item.y + ": </span>" : "") + item.q + '</p><p class="kc-hint">Which type of AI is this? Pick the most specific one.</p></div></div>' +
        '<div class="kc-answers" role="group" aria-label="Answers">' + ORDER.map(function(k){ return '<button type="button" class="kc-ans" data-k="' + k + '" style="--c:' + TYPES[k].c + '">' + ic("check") + TYPES[k].name + "</button>"; }).join("") + "</div>" +
        '<div class="kc-fbwrap" data-fb aria-live="polite"><p class="kc-wait">Pick an answer to see why.</p></div>';
      quiz.querySelectorAll(".kc-ans").forEach(function(b){ b.addEventListener("click", function(){ answer(b.getAttribute("data-k")); }); });
      if (focus) $(".kc-q").focus({ preventScroll:true });
    }
    function answer(k){
      var item = Q[idx], a = item.a, right = k === a, close = !right && isAncestor(k, a);
      res[idx] = right ? "ok" : close ? "close" : "no";
      var box = $(".kc-answers"); box.classList.add("done");
      box.querySelectorAll(".kc-ans").forEach(function(b){
        var bk = b.getAttribute("data-k"); b.disabled = true;
        if (bk === a){ b.classList.add("is-right"); b.setAttribute("aria-label", TYPES[bk].name + ", correct answer"); }
        if (bk === k){ b.classList.add("is-picked"); if (!right) b.setAttribute("aria-label", TYPES[k].name + ", your pick"); }
      });
      var headTxt = right ? "Correct"
        : close ? "Close. " + (a === "llm" ? "LLMs are" : "Generative AI is") + " a kind of " + TYPES[k].label + ", but " + TYPES[a].label.replace(/^an /, "") + " is more specific."
        : "Not quite. This one is " + TYPES[a].label + ".";
      $("[data-fb]").innerHTML = '<div class="kc-fb"><p class="kc-res' + (right ? "" : " is-off") + '">' + ic(right ? "check" : "dash") + headTxt + '</p><p class="kc-body">' + item.why + refs(item.refs) + "</p></div>" +
        '<div class="kc-nav"><button type="button" class="kc-btn kc-btn--solid" data-next>' + (idx < Q.length - 1 ? "Next question" : "See my result") + ic("arrow") + "</button></div>";
      var n = $("[data-next]");
      n.addEventListener("click", function(){ idx++; if (idx < Q.length) renderQ(true); else renderEnd(); sheet.scrollTop = 0; });
      n.focus({ preventScroll:true });
    }
    function renderEnd(){
      var score = res.filter(function(r){ return r === "ok"; }).length;
      var msg = score === Q.length ? "Every one. You know your AI." : score >= Q.length - 2 ? "Nicely spotted." : "AI hides in plain sight. Try again?";
      quiz.innerHTML = '<div class="kc-top"><p class="kc-count">Your result</p>' + dots() + "</div>" +
        '<p class="kc-score" tabindex="-1"><b>' + score + "/" + Q.length + "</b>" + msg + "</p>" +
        '<div class="kc-nav"><button type="button" class="kc-btn" data-again>Start again</button>' +
        (END && END.href ? '<a class="kc-btn kc-btn--solid" href="' + END.href + '" data-end>' + END.label + ic("arrow") + "</a>" : "") + "</div>";
      $(".kc-score").focus({ preventScroll:true });
      $("[data-again]").addEventListener("click", function(){ idx = 0; res = []; renderQ(); var f = $(".kc-ans"); if (f) f.focus(); });
      var e = $("[data-end]"); if (e) e.addEventListener("click", function(){ close(true); });
    }
    /* reserve the tallest feedback once, so the sheet doesn't jump as answers come in */
    var measuredAt = 0;
    function steady(){
      if (idx !== 0 || res.length || measuredAt === quiz.clientWidth) return;
      var fb = $("[data-fb]"); if (!fb) return;
      var max = 0, keep = fb.innerHTML;
      Q.forEach(function(item){
        fb.innerHTML = '<div class="kc-fb" style="animation:none"><p class="kc-res">' + ic("dash") + 'Close. Generative AI is a kind of machine learning, but LLM is more specific.</p><p class="kc-body">' + item.why + refs(item.refs) + '</p></div><div class="kc-nav"><button class="kc-btn" tabindex="-1">Next question</button></div>';
        max = Math.max(max, fb.offsetHeight);
      });
      fb.innerHTML = keep; quiz.style.setProperty("--kc-fb-h", max + "px"); measuredAt = quiz.clientWidth;
    }
    function open(){
      if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", "");
      sheet.scrollTop = 0; steady();
      var f = quiz.querySelector(".kc-ans:not([disabled])") || quiz.querySelector("[data-next],[data-again]"); if (f) f.focus({ preventScroll:true });
    }
    function close(immediate){
      if (!sheet.open || sheet.classList.contains("is-closing")) return;
      var done = function(){ sheet.classList.remove("is-closing"); if (sheet.close) sheet.close(); else sheet.removeAttribute("open"); opener.focus({ preventScroll:true }); };
      if (reduce || immediate === true){ done(); return; }
      sheet.classList.add("is-closing"); setTimeout(done, 260);
    }
    opener.addEventListener("click", open);
    root.querySelector("[data-kc-close]").addEventListener("click", close);
    sheet.addEventListener("cancel", function(e){ e.preventDefault(); close(); });
    sheet.addEventListener("click", function(e){ if (e.target === sheet){ var r = sheet.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) close(); } });
    window.addEventListener("resize", function(){ if (sheet.open){ measuredAt = 0; steady(); } });
    renderQ();
  }
  window.kcInit = kcInit;
  document.querySelectorAll(".kc-root[data-kc]").forEach(kcInit);
})();
</script>
