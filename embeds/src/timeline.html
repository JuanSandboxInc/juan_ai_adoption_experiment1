<!-- Sandbox Labs · History timeline (slideshow) · Webflow Embed (self-contained: style + markup + script) -->
<style>
.tl-root{--tl-navy:#13181d;--tl-grey:#d1d1d1;--tl-white:#fff;--tl-muted:rgba(255,255,255,.62);--tl-focus:#1bc594;
  --tl-pad-l:max(20px,env(safe-area-inset-left,0px));--tl-pad-r:max(20px,env(safe-area-inset-right,0px));
  container:tl / inline-size;color:var(--tl-white);font-family:inherit;background:var(--tl-navy)}
.tl-root *,.tl-root *::before,.tl-root *::after{box-sizing:border-box}
.tl-root :where(h3,p,figure){margin:0;padding:0}
.tl-root :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tl-root :where(img){display:block;max-width:none;border:0}
.tl-root :focus-visible{outline:3px solid var(--tl-focus);outline-offset:3px}
.tl-root sup{font-size:.62em;line-height:0;vertical-align:super;margin-left:1px}
.tl-root sup a{color:inherit;text-decoration:none;opacity:.8}
.tl-root sup a:hover{text-decoration:underline;opacity:1}
.tl-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* stage: every slide sits in the same grid cell, so the stage never changes height */
.tl-show{position:relative;max-width:1680px;margin-inline:auto;height:clamp(540px,min(56cqw,88vh),840px);overflow:hidden;background:var(--tl-navy);touch-action:pan-y;outline-offset:-3px}
.tl-slides{display:grid;height:100%}
.tl-slide{grid-area:1/1;position:relative;min-width:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.tl-slide.is-on{opacity:1;visibility:visible;z-index:2;transition:opacity .9s ease,visibility 0s}
.tl-slide.is-out{opacity:1;visibility:visible;z-index:1;transition:none}

.tl-media{position:absolute;inset:0;overflow:hidden;background:#0d1114}
.tl-img,.tl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl-img{transform:scale(1.07);transition:transform 9s cubic-bezier(.2,.6,.3,1)}
.tl-slide.is-on .tl-img{transform:scale(1)}
/* "contain" pictures (diagrams, covers, figures): shown whole, on a blurred, darkened copy of themselves */
.tl-bg{filter:blur(32px) saturate(1.1) brightness(.34);transform:scale(1.2)}
.is-contain .tl-img{top:72px;left:47%;width:calc(53% - clamp(24px,5cqw,88px));height:calc(100% - 144px);object-fit:contain;transform:scale(1.02);filter:drop-shadow(0 24px 48px rgba(0,0,0,.55))}
.is-contain.is-on .tl-img{transform:scale(1)}
.tl-media::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(19,24,29,.96) 0%,rgba(19,24,29,.78) 26%,rgba(19,24,29,.18) 58%,rgba(19,24,29,0) 74%,rgba(19,24,29,.42) 100%),
             linear-gradient(90deg,rgba(19,24,29,.72) 0%,rgba(19,24,29,.25) 46%,rgba(19,24,29,0) 70%)}
.is-contain .tl-media::after{background:linear-gradient(90deg,rgba(19,24,29,.55) 0%,rgba(19,24,29,0) 50%)}

.tl-text{position:absolute;left:clamp(24px,5cqw,88px);bottom:clamp(36px,5cqw,72px);width:min(620px,48cqw);display:flex;flex-direction:column;align-items:flex-start;z-index:1}
.is-contain .tl-text{width:min(560px,38cqw)}
.tl-text>*{opacity:0;transform:translateY(12px)}
.tl-slide.is-on .tl-text>*{opacity:1;transform:none;transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.tl-slide.is-on .tl-text>:nth-child(1){transition-delay:.15s}
.tl-slide.is-on .tl-text>:nth-child(2){transition-delay:.22s}
.tl-slide.is-on .tl-text>:nth-child(3){transition-delay:.3s}
.tl-slide.is-on .tl-text>:nth-child(4){transition-delay:.38s}
.tl-slide.is-on .tl-text>:nth-child(5){transition-delay:.46s}
.tl-root.is-waiting .tl-slide.is-on .tl-text>*{opacity:0;transform:translateY(12px)}
.tl-slide.is-out .tl-text{opacity:0;transition:opacity .25s}
.tl-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;background:rgba(19,24,29,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-size:13px;line-height:1.2;letter-spacing:.02em}
.tl-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tl-year{margin-top:14px;margin-left:-.05em;font-size:clamp(72px,8.4cqw,136px);font-weight:500;line-height:.88;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.tl-title{margin-top:18px;max-width:20ch;font-size:clamp(26px,1.6cqw + 12px,40px);font-weight:400;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.tl-body{margin-top:12px;max-width:52ch;font-size:clamp(16px,.3cqw + 13px,18px);line-height:1.5;color:var(--tl-grey);text-wrap:pretty}
.tl-credit{margin-top:18px;max-width:60ch;font-size:12px;line-height:1.4;color:var(--tl-muted)}
.tl-credit a{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:2px}
.tl-credit a:hover{color:var(--tl-white)}

/* progress: one thin segment per milestone, first and last year at the ends */
.tl-bar{position:absolute;z-index:3;top:clamp(18px,2.4cqw,32px);left:clamp(24px,5cqw,88px);right:clamp(24px,5cqw,88px);display:flex;align-items:center;gap:14px;font-size:12px;line-height:1;color:var(--tl-muted);font-variant-numeric:tabular-nums}
.tl-segs{flex:1 1 auto;display:flex;gap:3px;min-width:0}
.tl-seg{position:relative;flex:1 1 0;min-width:0;height:22px}
.tl-seg::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;border-radius:1px;background:rgba(255,255,255,.24);transition:background-color .4s,transform .3s}
.tl-seg.is-past::before{background:rgba(255,255,255,.62)}
.tl-seg[aria-current="true"]::before{background:var(--tl-white);transform:scaleY(1.5)}
.tl-seg::after{content:attr(data-y);position:absolute;left:50%;top:24px;transform:translateX(-50%);padding:3px 6px;border-radius:4px;background:rgba(19,24,29,.8);color:var(--tl-white);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.tl-seg:focus-visible::after{opacity:1}
@media (hover:hover){.tl-seg:hover::before{background:rgba(255,255,255,.85)}.tl-seg:hover::after{opacity:1}.tl-arrow:hover:not(:disabled){background:var(--tl-white);color:var(--tl-navy)}}

.tl-ctrl{position:absolute;z-index:3;right:clamp(24px,5cqw,88px);bottom:clamp(36px,5cqw,72px);display:flex;align-items:center;gap:10px}
.tl-count{margin-right:10px;font-size:14px;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--tl-muted)}
.tl-count b{font-weight:500;color:var(--tl-white)}
.tl-arrow{width:52px;height:52px;display:grid;place-items:center;border-radius:999px;background:rgba(19,24,29,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);transition:background-color .2s,color .2s,opacity .2s}
.tl-arrow:disabled{opacity:.28;cursor:default}
.tl-arrow svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tl-arrow--prev svg{transform:scaleX(-1)}

/* narrow (tablet portrait and phones): picture on top, words below on navy */
@container tl (max-width:759px){
  .tl-show{height:auto;display:flex;flex-direction:column}
  .tl-slides{height:auto}
  .tl-slide{display:flex;flex-direction:column;background:var(--tl-navy)}
  .tl-media{position:relative;inset:auto;flex:none;height:min(96cqw,520px)}
  .tl-media::after{background:linear-gradient(0deg,var(--tl-navy) 0%,rgba(19,24,29,.82) 22%,rgba(19,24,29,0) 52%),linear-gradient(180deg,rgba(19,24,29,.55) 0%,rgba(19,24,29,0) 22%)}
  .is-contain .tl-media::after{background:linear-gradient(0deg,var(--tl-navy) 0%,rgba(19,24,29,0) 30%),linear-gradient(180deg,rgba(19,24,29,.5) 0%,rgba(19,24,29,0) 18%)}
  .is-contain .tl-img{top:52px;left:20px;width:calc(100% - 40px);height:calc(100% - 180px)}
  .tl-text,.is-contain .tl-text{position:relative;left:auto;bottom:auto;width:auto;margin-top:-118px;padding:0 var(--tl-pad-r) 8px var(--tl-pad-l)}
  .tl-year{margin-top:10px;font-size:72px}
  .tl-title{margin-top:14px;font-size:26px}
  .tl-body{font-size:16px}
  .tl-credit{margin-top:14px;font-size:11.5px}
  .tl-bar{top:14px;left:var(--tl-pad-l);right:var(--tl-pad-r);gap:10px;font-size:11px}
  .tl-segs{gap:2px}
  .tl-ctrl{position:static;justify-content:flex-end;padding:16px var(--tl-pad-r) 4px var(--tl-pad-l)}
  .tl-count{margin-right:auto}
  .tl-arrow{width:48px;height:48px;background:none}
}
@container tl (max-width:420px){
  .tl-bar>span{display:none}
}
@media (prefers-reduced-motion:reduce){
  .tl-root *,.tl-root *::before,.tl-root *::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important}
  .tl-img,.is-contain .tl-img{transform:none!important}
}
</style>

    var N = MS.length, cur = -1, slides = [], segs = [], outT;
    function src(m){ return /^https?:|^\//.test(m.img) ? m.img : base + m.img; }

    q("[data-tl-first]").textContent = MS[0].y; q("[data-tl-last]").textContent = MS[N - 1].y;
    MS.forEach(function(m, i){
      var K = KIND[m.k] || KIND.ai, whole = m.fit === "contain", s = document.createElement("article");
      s.className = "tl-slide" + (whole ? " is-contain" : "");
      s.setAttribute("aria-roledescription", "slide"); s.setAttribute("aria-label", (i + 1) + " of " + N + ": " + m.y);
      var credit = m.link ? '<a href="' + esc(m.link) + '" target="_blank" rel="noopener">' + esc(m.credit) + "</a>" : esc(m.credit);
      s.innerHTML = '<figure class="tl-media">' + (m.img ? (whole ? '<img class="tl-bg" alt="" data-src="' + esc(src(m)) + '">' : "") +
          '<img class="tl-img" alt="' + esc(m.alt) + '" data-src="' + esc(src(m)) + '" decoding="async">' : "") + "</figure>" +
        '<div class="tl-text"><p class="tl-pill" style="--c:' + K.c + '">' + K.label + '</p><p class="tl-year">' + esc(m.y) + "</p>" +
        '<h3 class="tl-title">' + m.title + '</h3><p class="tl-body">' + m.body + refs(m.refs) + "</p>" +
        (m.img ? '<p class="tl-credit">' + esc(m.alt) + (m.credit ? " · " + credit : "") + "</p>" : "") + "</div>";
      wrap.appendChild(s); slides.push(s);
      var b = document.createElement("button");
      b.type = "button"; b.className = "tl-seg"; b.tabIndex = -1; b.setAttribute("data-y", m.y);
      b.setAttribute("aria-label", m.y + ": " + m.title.replace(/<[^>]+>/g, ""));
      b.addEventListener("click", function(){ go(i); });
      segWrap.appendChild(b); segs.push(b);
    });

    /* load the current picture and its neighbours only */
    function load(i){ if (i < 0 || i >= N) return; slides[i].querySelectorAll("img[data-src]").forEach(function(im){ im.src = im.getAttribute("data-src"); im.removeAttribute("data-src"); }); }

    function go(i, first){
      i = Math.max(0, Math.min(N - 1, i));
      if (i === cur) return;
      var old = cur; cur = i;
      load(i); load(i + 1); load(i - 1);
      slides.forEach(function(s, n){
        s.classList.toggle("is-out", n === old && !first);
        if (n === i){ s.classList.remove("is-on"); void s.offsetWidth; s.classList.add("is-on"); s.removeAttribute("aria-hidden"); }
        else { s.classList.remove("is-on"); s.setAttribute("aria-hidden", "true"); }
      });
      clearTimeout(outT); outT = setTimeout(function(){ slides.forEach(function(s){ s.classList.remove("is-out"); }); }, reduce ? 20 : 950);
      segs.forEach(function(b, n){
        b.classList.toggle("is-past", n < i);
        if (n === i){ b.setAttribute("aria-current", "true"); b.tabIndex = 0; } else { b.removeAttribute("aria-current"); b.tabIndex = -1; }
      });
      countEl.innerHTML = "<b>" + pad(i + 1) + "</b> / " + pad(N);
      prev.disabled = i === 0; next.disabled = i === N - 1;
      if (!first) live.textContent = (i + 1) + " of " + N + ". " + MS[i].y + ". " + MS[i].title.replace(/<[^>]+>/g, "");
    }

    prev.addEventListener("click", function(){ go(cur - 1); });
    next.addEventListener("click", function(){ go(cur + 1); });
    root.addEventListener("keydown", function(e){
      if (e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      var k = e.key, d = k === "ArrowRight" ? 1 : k === "ArrowLeft" ? -1 : 0;
      if (d){ go(cur + d); e.preventDefault(); }
      else if (k === "Home"){ go(0); e.preventDefault(); }
      else if (k === "End"){ go(N - 1); e.preventDefault(); }
      else return;
      if (e.target.classList && e.target.classList.contains("tl-seg")) segs[cur].focus({ preventScroll:true });
    });

    /* swipe left/right on the slide (touch and pen) */
    var sw = null;
    wrap.addEventListener("pointerdown", function(e){ if (e.pointerType !== "mouse") sw = { x:e.clientX, y:e.clientY }; });
    wrap.addEventListener("pointerup", function(e){
      if (!sw) return; var dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) go(cur + (dx < 0 ? 1 : -1));
    });
    wrap.addEventListener("pointercancel", function(){ sw = null; });

    go(0, true);
    /* the first slide's words rise in when the slideshow first comes into view */
    if (!reduce && "IntersectionObserver" in window){
      root.classList.add("is-waiting");
      var io = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ io.disconnect(); root.classList.remove("is-waiting"); } }, { threshold:.35 });
      io.observe(show);
    }
  }
  window.tlInit = tlInit;
  document.querySelectorAll(".tl-root[data-tl]").forEach(tlInit);
})();
</script>
