at Dartmouth College brings researchers together around a new term: “artificial intelligence”.",refs:[22],img:"6ad814f3a8b530b4e49864aa_timeline-02.jpg",alt:"Dartmouth summer workshop participants, outside Dartmouth Hall",credit:"Photo 1956 · Minsky family archive / IEEE Spectrum",link:"https://spectrum.ieee.org/dartmouth-ai-workshop"},{y:"1956",k:"sym",title:"The Logic Theorist",body:"Often called the first AI program, it follows logic rules written by Allen Newell, Herbert Simon and Cliff Shaw, and proves 38 theorems from a classic maths book.",refs:[38],img:"6ad814f36b77e4641923da35_timeline-03.jpg",alt:"Allen Newell and Herbert Simon with a chessboard",credit:"Photo c. 1958 · Carnegie Mellon University / Computer History Museum",link:"https://www.computerhistory.org/chess/stl-431e1a07cf7a1/"},{y:"1959",k:"ml",title:"“Machine learning” is coined",body:"IBM’s Arthur Samuel builds a checkers program that gets better by playing against itself, and calls the idea machine learning.",refs:[23],img:"6ad814f3cfb906381f372fba_timeline-04.jpg",alt:"Arthur Samuel at an IBM computer with a checkers board",credit:"Photo c. 1959 · IBM Archives",link:"https://www.ibm.com/history/early-games"},{y:"1966",k:"sym",title:"ELIZA, the first chatbot",body:"Joseph Weizenbaum’s ELIZA imitates a therapist by matching keywords to scripted replies. Many people who used it still felt understood.",refs:[24],img:"6ad814f3e72327ee5d374c97_timeline-05.jpg",alt:"Joseph Weizenbaum demonstrating a computer terminal",credit:"Photo 1965 · Documentary archive / DIE ZEIT",link:"https://forohistorico.coit.es/index.php/multimedia/filmoteca/item/weizenbaum-rebel-at-work"},{y:"1973",k:"ai",title:"The first “AI winter”",body:"A report for the UK’s Science Research Council finds that AI hasn’t delivered what it promised. Funding is cut at most British universities, and the field slows for years.",refs:[32],img:"6ad814f38601551b9a08ab59_timeline-06.jpg",alt:"Edinburgh researchers with the Freddy experimental robot",credit:"Photo early 1970s · University of Edinburgh archive",link:"https://spectrum.ieee.org/freddy-robot-british-ai-winter"},{y:"1970s",k:"sym",title:"Expert systems",body:"Stanford’s MYCIN suggests treatments for blood infections using hundreds of if-then rules written with doctors.",refs:[25],img:"6ad814f35006ad7e26ee1938_timeline-07.jpg",alt:"Ted Shortliffe at a computer terminal",credit:"Photo 1970s · Published MYCIN interview"},{y:"1986",k:"ml",title:"Neural networks learn from their mistakes",body:"Rumelhart, Hinton and Williams show how a neural network can learn by correcting its own errors. The method, backpropagation, still underpins deep learning.",refs:[34],img:"6ad814f38fba9820fd0256e3_timeline-08.jpg",alt:"Geoffrey Hinton at a whiteboard explaining neural networks",credit:"Photo late 1980s · CIFAR / Associated Press",link:"https://www.latimes.com/business/story/2025-08-29/ai-apocalypse-why-language-surrounding-tech-is-sounding-increasingly-religious"},{y:"1987",k:"sym",title:"A second winter",body:"The market for specialized AI computers collapses and expert systems prove costly to maintain. Funding dries up into the early 1990s.",refs:[33],img:"6ad814f3ff24c61cfa5b14fa_timeline-09.jpg",alt:"A researcher at a specialized workstation in an Inria lab",credit:"Photo 1987 · A. Eidelman / Inria",link:"https://www.inria.fr/en/our-history"},{y:"1997",k:"sym",title:"A computer beats the world chess champion",body:"IBM’s Deep Blue defeats Garry Kasparov by scoring 200 million positions a second with chess knowledge written in by its programmers.",refs:[19],img:"6ad814f36b77e4641923da51_timeline-10.jpg",alt:"Garry Kasparov during the IBM Deep Blue match",credit:"Photo 1997 · Photographer to identify",link:"https://www.gettyimages.co.uk/detail/news-photo/as-world-chess-champion-garry-kasparov-holds-his-head-in-news-photo/1240227174"},{y:"2012",k:"ml",title:"Deep learning takes off",body:"A neural network called AlexNet recognizes objects in photos far better than any rival, and deep learning becomes the leading approach.",refs:[26],img:"6ad814f32cba6d577435f9b3_timeline-11.jpg",alt:"The AlexNet researchers: Sutskever, Hinton and Krizhevsky",credit:"Photo 2013 · Johnny Guatto / University of Toronto",link:"https://www.utoronto.ca/news/four-papers-authored-u-t-scholars-among-25-most-cited-21st-century-nature",fit:"contain"},{y:"2014",k:"gen",title:"Machines start to generate images",body:"Generative adversarial networks (GANs) set two neural networks against each other: one creates images, the other tries to spot the fakes.",refs:[27],img:"6ad814f335a3f97683f493ab_timeline-12.jpg",alt:"People viewing a GAN-generated portrait at Christie’s",credit:"Photo 2018 · Timothy A. Clary / AFP / Getty; artwork by Obvious",link:"https://www.wired.com/story/teenagers-code-spawned-dollar-432500-piece-of-art/"},{y:"2016",k:"ml",title:"A computer learns to play Go",body:"DeepMind’s AlphaGo beats champion Lee Sedol 4–1. Unlike Deep Blue, it learned its own strategy: first from expert games, then by playing itself.",refs:[35],img:"6ad814f3d3a96daeda56b16a_timeline-13.jpg",alt:"Lee Sedol playing against AlphaGo at the challenge match",credit:"Photo 2016 · AlphaGo challenge-match photography",link:"https://www.nationalgeographic.com.es/ciencia/breve-historia-visual-inteligencia-artificial_14419",fit:"contain"},{y:"2017",k:"llm",title:"The transformer",body:"Google researchers publish “Attention Is All You Need”, introducing the transformer: the design behind today’s large language models.",refs:[28],img:"6ad814f3e45dc4de790152ae_timeline-14.jpg",alt:"Figure 1 of “Attention Is All You Need”: the original transformer diagram",credit:"Paper figure, 2017 · Vaswani et al. / NeurIPS 2017",link:"https://arxiv.org/abs/1706.03762",fit:"contain"},{y:"2018",k:"llm",title:"The first GPT",body:"OpenAI trains a transformer on thousands of books to predict the next word. It is the first “generative pre-trained transformer”.",refs:[29],img:"6ad814f3ec994834f129765d_timeline-15.jpg",alt:"OpenAI hackathon participants working on laptops",credit:"Photo March 2018 · OpenAI",link:"https://openai.com/index/hackathon-follow-up/"},{y:"2020",k:"llm",title:"Language models get much bigger",body:"OpenAI’s GPT-3 has 175 billion parameters and can handle new language tasks from a few examples. Its fluency shows how far large-scale training can take a general-purpose model.",refs:[],img:"6ad814f3355fb70a822ae13a_timeline-16.jpg",alt:"Microsoft Azure data-centre infrastructure",credit:"Photo c. 2020 · Microsoft / Tom’s Hardware",link:"https://www.tomshardware.com/news/microsoft-openai-supercomputer-azure-top-5"},{y:"2022",k:"gen",title:"Pictures from words, for everyone",body:"Image generators such as Stable Diffusion and DALL·E 2 open to the public. Anyone can type a description and get a new picture in seconds.",refs:[36,37],img:"6ad814f325466e2bd3ecf0a6_timeline-17.jpg",alt:"AI artwork displayed with its first-place state-fair ribbon",credit:"Photo 2022 · Artwork by Jason Allen",link:"https://www.washingtonpost.com/technology/2022/09/02/midjourney-artificial-intelligence-state-fair-colorado/",fit:"contain"},{y:"2022",k:"llm",title:"ChatGPT goes public",body:"OpenAI releases ChatGPT. It reaches an estimated 100 million users in about two months, and generative AI goes mainstream.",refs:[30],img:"6ad814f3d867e84af9b9151d_timeline-18.jpg",alt:"Sam Altman on the TIME 100 Most Influential Companies cover",credit:"Photo 2023 · TIME magazine",fit:"contain"},{y:"2023",k:"llm",title:"The AI race accelerates",body:"GPT-4 arrives, and competing labs release more powerful models: Anthropic’s Claude, Meta’s Llama and Google’s Gemini. AI becomes a fast-moving global race, shaped by many companies and research communities.",refs:[],img:"6ad814f35006ad7e26ee194a_timeline-19.jpg",alt:"Participants at the Bletchley Park AI Safety Summit",credit:"Photo November 2023 · Leon Neal / Pool via Reuters",link:"https://www.reutersconnect.com/item/ai-sa
